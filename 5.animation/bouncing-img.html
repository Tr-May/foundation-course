<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Transform, Transition, and Animation</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        margin: 50px auto;
        background-image: url(images/blue-sphere.png);
        background-size: cover;
        animation: bounce 2s infinite;
        /* animation: fade 2s infinite; */
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-30px);
        }
        60% {
          transform: translateY(-15px);
        }
      }
      /* @keyframes fade {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      } */
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
