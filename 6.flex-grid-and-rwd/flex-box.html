<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Layout</title>
    <style>
      .row-container,
      .column-container {
        border: 1px solid #000;
      }
      .box {
        width: 50px;
        height: 50px;
        background: orange;
        border: 3px solid orangered;
        border-radius: 5px;
      }
      .mb-30 {
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="row-container mb-30">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <div class="column-container">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
