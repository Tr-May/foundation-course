<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>fixed positioning</title>
    <style>
      .main-element {
        background-color: yellow;
        padding: 10px;  
      }
      .sibling-element {
        padding: 10px;
        background-color: #0386f8;
      }
    </style>
  </head>
  <body class="m-30">
    <!-- Fixed position elements are similar to absolutely positioned elements. 
		They are also removed from the normal flow of the document.
		But unlike absolutely positioned element, they are always positioned 
		relative to the <html> element. -->

    <div class="parent-element">
      <div class="sibling-element">simple division.</div>
      <div class="main-element">&uarr;</div>
      <div class="sibling-element">another simple division</div>
    </div>
  </body>
</html>
