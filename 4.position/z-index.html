<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>CSS z-index Property Example</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
      }
      .bg-lightblue {
        background-color: lightblue;
      }
      .bg-lightcoral {
        background-color: lightcoral;
      }
      .bg-lightgreen {
        background-color: lightgreen;
      }
    </style>
  </head>
  <body class="m-30">
    <!-- The z-index property is used to control the stacking order of
    elements in a web page when they overlap. It determines which elements
    should appear in front of or behind others in the z-axis, which is
    perpendicular to the screen. Elements with higher z-index values are stacked
    on top of elements with lower z-index values. -->

    <h1 class="mb-20">CSS z-index Property</h1>

    <div class="box bg-lightblue">Box 1</div>
    <div class="box bg-lightcoral">Box 2</div>
    <div class="box bg-lightgreen">Box 3</div>
  </body>
</html>
