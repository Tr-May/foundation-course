<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        height: 100vh;
        background: linear-gradient(to bottom right, #afc9d2, #3b5d69);
      }
      form {
        width: 400px;
        height: 300px;
        background-color: white;
        padding: 20px;
        text-align: center;
      }
      .form-control {
        width: 100%;
        display: block;
        padding: 15px 0;
        margin: 20px auto 10px auto;
        border: 1px solid #000;
        outline: 0;
      }
      .btn {
        width: 100%;
        display: block;
        padding: 15px;
        margin: 20px auto 10px auto;
        background-color: #3b5d69;
        color: white;
      }
      ::placeholder{
        font-size: 1.3em;
        color: #3b5d69;
        text-indent: 1em;
      }
    </style>
  </head>
  <body>
    <form action="">
      <input
        class="form-control"
        type="text"
        name=""
        id=""
        placeholder="Your Name"
      />
      <input
        class="form-control"
        type="password"
        name=""
        id=""
        placeholder="Password"
      />
      <input class="btn" type="submit" value="Login" />
      <p>Not Registered yet? <a href="#">Create an Account</a></p>
    </form>
  </body>
</html>
