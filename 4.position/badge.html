<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
    <style>
      .container {
        width: 80vw;
        margin: 50px auto;
      }
      .btn {
        width: 150px;
        padding: 15px 10px;
        text-align: left;
        background-color: blueviolet;
        color: white;
        outline: none;
        border: none;
        border-radius: 8px;
      }
      .badge {
        background-color: white;
        color: red;
        font-weight: bold;
        padding: 5px;
        border-radius: 50%;
        font-size: 0.8em;
        margin-top: -4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="mb-20">Badge using float property</h2>
      <button class="btn">
        Notifications
        <span class="badge">20</span>
      </button>
    </div>
  </body>
</html>
