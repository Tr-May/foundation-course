<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layered Image Gallery</title>
    <style>
      /* Container for the gallery */
      .gallery {
        position: relative;
        width: 80%;
        height: 400px;
        margin: 50px auto;
      }

      /* Styling for each image container */
      .image-container {
        position: absolute;
        width: 200px;
        transition: transform 0.3s ease, z-index 0.3s ease;
      }

      /* Styling for the images */
      .image {
        width: 100%;
        border: 5px solid #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        border-radius: 10px;
      }

      /* Styling for captions */
      .caption {
        text-align: center;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px;
        margin: 0;
        border-radius: 5px;
      }

      /* Positioning and z-index for each image */
      .image-container:nth-child(1) {
        top: 0;
        left: 0;
        z-index: 1;
      }

      .image-container:nth-child(2) {
        top: 50px;
        left: 150px;
        z-index: 2;
      }

      .image-container:nth-child(3) {
        top: 100px;
        left: 300px;
        z-index: 3;
      }

      /* Hover effect to bring images to the front */
      .image-container:hover {
        transform: scale(1.2);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="gallery">
      <div class="image-container">
        <img
          src="https://picsum.photos/id/237/200/300"
          alt="Image 1"
          class="image"
        />
        <p class="caption">Cute Dog</p>
      </div>
      <div class="image-container">
        <img
          src="https://picsum.photos/id/238/200/300"
          alt="Image 2"
          class="image"
        />
        <p class="caption">City Lights</p>
      </div>
      <div class="image-container">
        <img
          src="https://picsum.photos/id/239/200/300"
          alt="Image 3"
          class="image"
        />
        <p class="caption">Mountain View</p>
      </div>
    </div>
  </body>
</html>
